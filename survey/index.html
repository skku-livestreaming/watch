}

/* ───────── 관리자 모드 (?admin=1) ─────────
   화면 아래 막대에서 화면·조건을 고르면 바로 그 화면으로 갑니다. 응답은 저장하지 않습니다. */
let admOpen = true;
function admScreens(){
  const L = [['consent', 'Consent'], ['id', 'Enter ID (no ID in link)']];
  (C.PAGES.pre || []).forEach((p, i) => L.push(['pre:' + i, `Before · ${p.id}${p.showIf ? ' (some conditions)' : ''}`]));
  L.push(['intro', 'Before the stream'], ['stimulus', 'Live stream'], ['stimreturn', 'Live stream · came back after refresh']);
  (C.PAGES.post || []).forEach((p, i) => L.push(['post:' + i, `After · ${p.id}${p.showIf ? ' (some conditions)' : ''}`]));
  L.push(['debrief', 'Debrief'], ['done', 'Complete'],
    ['end:screened', 'Exit · not eligible'], ['end:attention', 'Exit · attention check'],
    ['end:full', 'Exit · study full'], ['end:mobile', 'Exit · computer required'], ['lost', 'Session not found']);
  return L;
}
function admCurrent(){
  if (!S) return 'consent';
  if (S.stage === 'pre' || S.stage === 'post') return S.stage + ':' + S.page;
  if (S.stage === 'end') return 'end:' + (S.meta.end_reason || 'screened');
  if (S.stage === 'stimulus') return stimOpened ? 'stimulus' : 'stimreturn';
  return S.stage;
}
function admGo(key, cellId){
  if (window.__stimStop) window.__stimStop();
  const w = document.getElementById('stimWrap'); if (w) w.remove();
  document.body.classList.remove('stim-on');
  if (!S || !S.pid) S = newState('TEST_ADMIN');
  const cell = C.CELLS.find(c => c.id === cellId) || C.CELLS[0];
  S.cell = cell;
  Object.assign(S.meta, {is_test: 1, cell: cell.id, group: cell.group, cong: cell.cong, stim_code: cell.code});
  const [st, arg] = key.split(':');
  if (st === 'pre' || st === 'post'){ S.stage = st; S.page = Number(arg); }
  else if (st === 'end'){ S.stage = 'end'; S.meta.end_reason = arg; }
  else if (st === 'stimulus'){ S.stage = 'stimulus'; stimOpened = true; }
  else if (st === 'stimreturn'){ S.stage = 'stimulus'; stimOpened = false; }
  else S.stage = st;
  render();
}
function adminPanel(){
  let d = document.getElementById('adm');
  if (!d){ d = document.createElement('div'); d.id = 'adm'; document.body.appendChild(d); }
  document.getElementById('dbg').hidden = true;
  document.body.classList.toggle('adm-on', admOpen);
  if (!admOpen){
    d.className = 'min';
    d.innerHTML = `<button id="admShow" type="button">Admin</button>`;
    d.querySelector('#admShow').onclick = () => { admOpen = true; adminPanel(); };
    return;
  }
  d.className = '';
  const cur = admCurrent();
  const curCell = S && S.cell ? S.cell.id : C.CELLS[0].id;
  // 조건 이름: group(시청자) · cong(일치 정도)
  const gName = {ai: 'AI viewers', human: 'Human viewers', mixed: 'Half AI / half human'};
  const cName = {all: '100%', half: '50%', none: '0%'};
  d.innerHTML = `
    <span class="adm-tag">ADMIN</span>
    <label>Screen <select id="admScreen">${admScreens().map(([k, t]) => `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
    <button type="button" id="admPrev" aria-label="Previous screen">‹</button><button type="button" id="admNext" aria-label="Next screen">›</button>
    <label>Condition <select id="admCell">${C.CELLS.map(c => `<option value="${c.id}"${c.id === curCell ? ' selected' : ''}>${esc(gName[c.group] || c.group)} · ${cName[c.cong] || c.cong} (${c.id})</option>`).join('')}</select></label>
    <label>Waits <select id="admFast"><option value="0"${FAST ? '' : ' selected'}>Real time</option><option value="1"${FAST ? ' selected' : ''}>Fast (3 s)</option></select></label>
    <button type="button" id="admReplay">Replay</button>
    <span class="adm-note">Nothing is saved${S && S.stage === 'stimulus' && stimOpened ? ' · stream in preview mode (not logged)' : ''}</span>
    <span class="adm-note" title="${esc(deploymentIssues().join(' '))}">Participant setup: ${deploymentIssues().length ? deploymentIssues().length + ' items remaining' : 'ready'}</span>
    <button type="button" id="admHide" class="ghost">Hide</button>`;
  const scr = d.querySelector('#admScreen'), cel = d.querySelector('#admCell');
  const go = () => admGo(scr.value, cel.value);
  scr.onchange = go; cel.onchange = go;
  const step = k => { const i = scr.selectedIndex + k; if (i >= 0 && i < scr.options.length){ scr.selectedIndex = i; go(); } };
  d.querySelector('#admPrev').onclick = () => step(-1);
  d.querySelector('#admNext').onclick = () => step(1);
  d.querySelector('#admFast').onchange = e => {
    FAST = e.target.value === '1';
    try { sessionStorage.setItem('lsv_admin_fast', FAST ? '1' : '0'); } catch (err) {}
    go();
  };
  d.querySelector('#admReplay').onclick = go;
  d.querySelector('#admHide').onclick = () => { admOpen = false; adminPanel(); };
}

if (PILOT){
  document.body.classList.add('pilot-on');
  const notice = document.createElement('div'); notice.id = 'pilotNotice';
  notice.textContent = 'RESEARCHER STORAGE TEST · ' + PILOT_PID + ' · Test records saved. No Connect submission or payment.';
  document.body.prepend(notice);
}
init();
})();
</script>
