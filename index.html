<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라이브 스트리밍 자극물 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  /* 첫 페인트 전에 테마를 적용합니다. 기본은 화이트이므로 dark일 때만 속성을 붙입니다. */
  try {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  /* ── 화이트 테마 (기본) ───────────────── */
  --bg:#ffffff;
  --panel:#f7f8fa;        /* 채팅·투표 패널 */
  --panel-2:#eceef2;      /* 입력·세그먼트 버튼 */
  --panel-3:#f2f3f6;      /* 실험자 바 */
  --panel-4:#e9ebf0;      /* 실험자 본문 */
  --line:#dfe2e8;
  --line-2:#b9bfcb;       /* hover 경계 */
  --ink:#16181c;
  --ink-dim:#5a6070;
  --ink-faint:#5f6676;
  --note:#5f6676;
  --live:#e03127;
  --accent:#2f5bc5;
  --on-accent:#ffffff;    /* accent 배경 위 글자 */
  --ai:#0b7a62;
  --lab:#8a5d00;
  --nick:#3f4654;         /* 사람 닉네임 */
  --ic-bg:#d6dae2;
  --ic-ink:#3f4654;
  --thumb:#d8dce3;
  --code-bg:#f4f5f8;
  --code-ink:#3c4455;
  --accent-tint:rgba(47,91,197,.10);
  --ai-tint:rgba(11,122,98,.12);
  --ai-border:rgba(11,122,98,.40);
  --lab-tint:rgba(138,93,0,.14);
  --lab-border:rgba(138,93,0,.30);
  --stance-a-bg:rgba(47,91,197,.12);
  --stance-a-ink:#2a52b4;
  --stance-b-bg:rgba(224,49,39,.12);
  --stance-b-ink:#c22a21;
  /* 영상 안쪽은 어느 테마에서도 어둡습니다 — 고정값 */
  --video-1:#232833;
  --video-2:#141820;
  --on-video:#cfd5df;
  --overlay:rgba(0,0,0,.72);   /* 영상 위 배지 — 양 테마 공통 */
  --badge-bg:rgba(255,255,255,.92);  /* 카드 썸네일 위 배지 */
  --badge-ink:#16181c;
  --svg-floor:#2b313d;
  --svg-prop:#232935;
  --svg-body:#39414f;
  --svg-head:#4a5363;
  --svg-dark:#1b1f27;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
/* ── 다크 테마 (theme=dark) ─────────────── */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1013;
  --panel:#171a20;
  --panel-2:#1e222a;
  --panel-3:#101318;
  --panel-4:#0c0f13;
  --line:#2a2f39;
  --line-2:#3b4250;
  --ink:#e9ecf1;
  --ink-dim:#9aa3b2;
  --ink-faint:#838b9c;
  --note:#747c8d;
  --live:#f2564b;
  --accent:#6f8fe8;
  --on-accent:#0e1013;
  --ai:#57c3a6;
  --lab:#f0c05a;
  --nick:#b7c0d0;
  --ic-bg:#3a4250;
  --ic-ink:#cdd4e0;
  --thumb:#1b1f27;
  --code-bg:#0c0f13;
  --code-ink:#9fb0c6;
  --accent-tint:rgba(111,143,232,.14);
  --ai-tint:rgba(87,195,166,.18);
  --ai-border:rgba(87,195,166,.45);
  --lab-tint:rgba(240,192,90,.20);
  --lab-border:rgba(240,192,90,.35);
  --stance-a-bg:rgba(111,143,232,.20);
  --stance-a-ink:#9db2ee;
  --stance-b-bg:rgba(242,86,75,.18);
  --stance-b-ink:#f08b82;
  --badge-bg:rgba(0,0,0,.72);
  --badge-ink:#ffffff;
}
*,*::before,*::after{box-sizing:inherit}
/* display를 지정한 요소(.locked, .poll-why, .feed 등)에서 hidden 속성이
   UA 스타일보다 낮은 우선순위로 밀리는 것을 막습니다. */
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px}

/* ── 실험자 패널 ───────────────────────── */
#lab{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--panel-3);border-bottom:1px solid var(--line);
}
#lab .bar{
  max-width:1180px;margin:0 auto;padding:8px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.labtag{
  color:var(--lab);font-size:12px;font-weight:700;letter-spacing:.02em;
  border:1px solid var(--lab-border);border-radius:4px;padding:2px 7px;
}
#lab .spacer{flex:1}
#lab button.ghost{
  background:transparent;color:var(--ink-dim);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;font-size:13px;
}
#lab button.ghost:hover{color:var(--ink);border-color:var(--line-2)}
#labBody{display:none;border-top:1px solid var(--line);background:var(--panel-4)}
#labBody.open{display:block}
#labBody .inner{
  max-width:1180px;margin:0 auto;padding:16px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px 26px;
}
.fld{display:flex;flex-direction:column;gap:7px}
.fld>span{font-size:12.5px;color:var(--ink-faint)}
.fld .note{font-size:11.5px;color:var(--note);line-height:1.4}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{
  flex:1;background:transparent;border:0;color:var(--ink-dim);
  padding:7px 6px;font-size:13px;
}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);font-weight:500}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.fld input[type=number]{
  background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);padding:7px 9px;font-family:inherit;font-size:14px;width:100%;
}
.val{color:var(--ink);font-variant-numeric:tabular-nums}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{
  background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  color:var(--ink-dim);padding:6px 11px;font-size:13px;
}
.presets button:hover{color:var(--ink)}
.hint{grid-column:1/-1;font-size:12.5px;color:var(--ink-faint);margin:0;line-height:1.7}

/* ── 공통 헤더(플랫폼 흉내) ─────────────── */
.site{
  border-bottom:1px solid var(--line);background:var(--bg);
}
.site .inner{
  max-width:1180px;margin:0 auto;padding:13px 16px;
  display:flex;align-items:center;gap:14px;
}
.logo{font-weight:700;letter-spacing:-.02em;font-size:17px}
.logo em{font-style:normal;color:var(--accent)}
.navdim{color:var(--ink-faint);font-size:13.5px}

/* ── 탐색 화면 ─────────────────────────── */
/* 채팅 사용자 카드 — 플랫폼의 프로필 팝오버와 같은 역할. */
.ucard{
  position:fixed;z-index:40;width:218px;
  background:var(--panel);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.18);padding:11px 12px;
  font-size:12.5px;line-height:1.5;
}
.uc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.uc-ic{
  width:26px;height:26px;border-radius:50%;flex:none;
  display:grid;place-items:center;font-size:10px;font-weight:800;
  background:var(--ic-bg);color:var(--ic-ink);
}
.uc-ic.ai{background:var(--ai-tint);color:var(--ai);border:1px solid var(--ai-border)}
.uc-nm{font-weight:700;font-size:13px;word-break:break-all}
.uc-rows{display:flex;flex-direction:column;gap:4px}
.uc-row{display:flex;justify-content:space-between;gap:10px}
.uc-row .k{color:var(--ink-faint)}
.uc-row .v{font-weight:600;font-variant-numeric:tabular-nums}
.uc-row .v.ai{color:var(--ai)}
.msg .nm,.msg .ic{cursor:pointer}
/* 플랫폼 공지 줄. 현재는 쓰지 않습니다 — 실제 플랫폼은 투표 예고를 채팅에 쓰지 않습니다.
   실제 클립을 넣은 뒤 "채팅이 제한되었습니다" 같은 모드 변경 줄이 필요하면 이 스타일을 씁니다. */
.msg.sys{
  background:var(--accent-tint);border-left:3px solid var(--accent);
  border-radius:0 6px 6px 0;padding:7px 10px;margin:3px 0;
  font-size:13px;color:var(--ink-dim);font-weight:600;line-height:1.5;
}
.msg.sys .nm,.msg.sys .ic{cursor:default}
/* ── 시청 화면 ─────────────────────────── */
.watch{display:none;grid-template-columns:minmax(0,1fr) 336px;gap:18px;margin-top:22px}
.watch.on{display:grid}
.stage{min-width:0}
.playwrap{position:relative}
.player{
  position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:linear-gradient(170deg,var(--video-1),var(--video-2) 68%);
}
.ph-tag{
  position:absolute;left:12px;bottom:12px;z-index:3;
  font-size:11px;color:var(--on-video);background:rgba(0,0,0,.5);
  padding:3px 7px;border-radius:4px;
}
/* 영상 위 상시 수치 패널 — 시청 중에도 조작값이 계속 보이게. */
.live-stat{
  position:absolute;right:12px;top:12px;z-index:4;
  display:flex;gap:16px;align-items:flex-end;
  background:rgba(10,12,16,.82);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.16);border-radius:10px;
  padding:10px 16px;color:#fff;
}
.live-stat .unit{display:flex;flex-direction:column;gap:2px;line-height:1}
.live-stat .lbl{font-size:11px;opacity:.75;letter-spacing:.02em}
.live-stat .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.live-stat .num small{font-size:13px;font-weight:500;margin-left:1px;opacity:.85}
.live-stat .unit.ai .num{color:#6fe3c2}
.live-stat .unit.ai .lbl{color:#9fe8d3}
.live-stat .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.2)}
@media (max-width:860px){
  .live-stat{right:8px;top:8px;padding:7px 11px;gap:11px}
  .live-stat .num{font-size:19px}
}
.player .live{
  position:absolute;left:12px;top:12px;z-index:3;display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.55);padding:4px 9px;border-radius:5px;font-size:12px;font-weight:700;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.player .clock{
  position:absolute;right:10px;bottom:10px;z-index:3;font-size:12px;color:var(--on-video);
  background:rgba(0,0,0,.55);padding:3px 8px;border-radius:4px;font-variant-numeric:tabular-nums;
}
.scene{position:absolute;inset:0;display:grid;place-items:center}
.scene svg{width:58%;max-width:330px;height:auto}
.mouth{transform-origin:center;animation:talk 1.1s infinite}
@keyframes talk{0%,100%{transform:scaleY(.4)}45%{transform:scaleY(1.15)}}
.info{padding:14px 2px 0;border-bottom:1px solid var(--line);padding-bottom:16px}
.info h2{margin:0;font-size:17px;font-weight:700}
.info .row{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.who{font-size:14px;font-weight:500}
.cnt{font-size:14.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cnt.ai{color:var(--ai)}
.leave{
  margin-left:auto;background:var(--panel-2);border:1px solid var(--line);
  color:var(--ink-dim);border-radius:7px;padding:7px 13px;font-size:13.5px;
}
/* 구독 버튼. 누르라는 안내는 두지 않습니다 — 반응 버튼과 같은 원칙. */
.sub{
  background:var(--accent);color:var(--on-accent);
  border:1px solid var(--accent);border-radius:7px;
  padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}
.sub[aria-pressed="true"]{
  background:var(--panel-2);color:var(--ink-dim);border-color:var(--line-2);font-weight:600;
}
.leave:hover{color:var(--ink)}

/* ── 안내 페이지 ───────────────────────── */
.intro{display:none;max-width:580px;margin:56px auto 0}
.intro.on{display:block}
.intro h1{font-size:21px;font-weight:700;margin:0 0 12px}
.intro-lead{margin:0 0 20px;font-size:14.5px;color:var(--ink-dim);line-height:1.7}
.intro-card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:18px 20px;display:flex;flex-direction:column;gap:11px;
}
.intro-row{display:flex;align-items:baseline;gap:12px;font-size:14.5px}
.intro-row .k{color:var(--ink-faint);font-size:13px;min-width:78px}
.intro-row .v{font-weight:700;font-variant-numeric:tabular-nums}
.intro-row .v.ai{color:var(--ai)}
.intro-note{margin:16px 0 0;font-size:13px;color:var(--ink-faint);line-height:1.7}
.intro-id{display:flex;flex-direction:column;gap:7px;margin:20px 0 4px}
.intro-id label{font-size:14px;font-weight:600}
.intro-id input{
  font:inherit;font-size:15px;padding:11px 13px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--bg);color:var(--ink);
}
.intro-id input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.intro-id input.bad{border-color:var(--live)}
.id-note{font-size:12.5px;color:var(--ink-faint)}
.id-note.bad{color:var(--live);font-weight:600}
.intro-go{
  margin-top:22px;background:var(--accent);border:0;border-radius:8px;
  color:var(--on-accent);font-weight:700;padding:12px 26px;font-size:14.5px;
}

/* ── 반응 버튼 ─────────────────────────── */
.reacts{display:inline-flex;gap:6px}
/* 방송 종료 화면 */
.player.off .scene,.player.off .ph-tag,.player.off .live,.player.off .clock{opacity:0}
.player.off{background:#0b0d11}
.endcard{
  position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;padding:18px;
  background:rgba(8,10,14,.92);color:#eef1f6;text-align:center;
}
.ec-hd{margin:0;font-size:15px;font-weight:700}
.ec-sub{
  background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;
  padding:9px 22px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
}
.ec-sub[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#cfd5df}
.ec-lb{margin:6px 0 0;font-size:12px;color:rgba(255,255,255,.6)}
.ec-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ec-item{
  width:140px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:0 0 8px;overflow:hidden;cursor:pointer;
  color:#eef1f6;font-family:inherit;text-align:left;
}
.ec-item:hover{background:rgba(255,255,255,.13)}
.ec-thumb{display:block;height:62px;background:linear-gradient(140deg,#2a3140,#1a1f29)}
.ec-t{display:block;font-size:12px;font-weight:600;line-height:1.35;padding:7px 8px 0}
.ec-v{display:block;font-size:11px;color:rgba(255,255,255,.55);padding:3px 8px 0}
@media (max-width:860px){
  .endcard{gap:7px;padding:12px}
  .ec-item{width:118px}
  .ec-thumb{height:52px}
}

.react{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:7px;padding:6px 11px;font-size:13px;line-height:1;
  font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;
}
/* 엄지 아이콘은 SVG로 둡니다. 이모지(👍)는 기기마다 글꼴이 달라
   참가자가 보는 자극물이 윈도우·맥·안드로이드에서 제각각이 됩니다. */
.react .th{width:16px;height:16px;fill:currentColor;display:block}
.react.down .th{transform:rotate(180deg)}
.react:hover{color:var(--ink)}
.react[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.react .rc{margin-left:3px}

/* ── Study 2: 영상 위 투표 오버레이 ──────────
   영상 위라 어느 테마에서도 어둡습니다 — 고정 색을 씁니다. */
.poll{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:5;
  background:rgba(14,16,20,.93);border:1px solid rgba(255,255,255,.14);
  border-radius:10px;padding:13px 15px;backdrop-filter:blur(6px);color:#eef1f6;
  max-width:560px;animation:pollIn .22s ease-out;
}
@keyframes pollIn{from{opacity:0;transform:translateY(10px)}}
.poll-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.poll-tag{
  font-size:11px;font-weight:700;letter-spacing:.03em;
  background:var(--live);color:#fff;padding:2px 7px;border-radius:3px;
}
.poll-timer{font-size:12px;color:#aab3c2;font-variant-numeric:tabular-nums;margin-left:auto}
.poll-q{margin:0;font-size:14.5px;font-weight:700;line-height:1.4}
.poll-body{margin:7px 0 0;font-size:13px;color:#b7c0cf;line-height:1.55;white-space:pre-line}
.poll-opts{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.poll-opts button{
  flex:1 1 180px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
  color:#eef1f6;border-radius:8px;padding:13px;font-size:14px;font-weight:600;
  text-align:center;line-height:1.35;cursor:pointer;font-family:inherit;
}
.poll-opts button:hover:not(:disabled){border-color:#8fa8ef;background:rgba(255,255,255,.12)}
.poll-opts button:disabled{opacity:.45;cursor:default}
.poll-opts button[aria-pressed="true"]{
  border-color:#8fa8ef;background:rgba(143,168,239,.22);opacity:1;font-weight:700;
}
.poll-done{margin:11px 0 0;font-size:12.5px;color:#6fd6b8}

/* 이유 작성 — 잠긴 채팅창 안 */
.poll-why{margin-top:14px;display:flex;flex-direction:column;gap:9px;width:100%;text-align:left}
.poll-why label{font-size:13px;color:var(--ink-dim)}
.poll-why textarea{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:10px 12px;font-family:inherit;font-size:14px;resize:vertical;
}
.poll-send{
  align-self:flex-start;background:var(--accent);border:0;border-radius:7px;
  color:var(--on-accent);font-weight:700;padding:9px 18px;font-size:13.5px;
}
.why-note{font-size:12px;color:var(--note);line-height:1.5}
.why-note.bad{color:var(--live);font-weight:600}

/* 채팅 */
.locked{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--ink-faint);font-size:13.5px;text-align:center;padding:20px;
}
.lock-ic{font-size:24px;opacity:.5}
.msg .stance{
  display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;
  padding:0 4px;margin-right:5px;vertical-align:1px;
}
.msg .stance.a{background:var(--stance-a-bg);color:var(--stance-a-ink)}
.msg .stance.b{background:var(--stance-b-bg);color:var(--stance-b-ink)}
.msg .why{color:var(--ink-dim)}

.chat{
  display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;height:min(74vh,620px);
}
.chat header{
  padding:10px 13px;border-bottom:1px solid var(--line);
  font-size:13.5px;color:var(--ink-dim);display:flex;align-items:center;gap:8px;
}
.chat header .aiq{margin-left:auto;color:var(--ai);font-size:12.5px}
.feed{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.msg{font-size:14px;line-height:1.45;word-break:break-word;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.msg .nm{font-weight:700;margin-right:5px}
.msg .nm.human{color:var(--nick)}
.msg .nm.ai{color:var(--ai)}
.msg .nm.me{color:var(--lab)}
.ic{
  display:inline-block;width:15px;height:15px;border-radius:4px;margin-right:5px;
  vertical-align:-2px;font-size:9.5px;line-height:15px;text-align:center;font-weight:700;
}
.ic.human{background:var(--ic-bg);color:var(--ic-ink);border-radius:50%}  /* 글자가 없는 칸이라 사각형이면 깨진 이미지처럼 보입니다 — 기본 프로필 점으로 */
.ic.ai{background:var(--ai-tint);color:var(--ai);border:1px solid var(--ai-border)}
.ic.me{background:var(--lab-tint);color:var(--lab)}
.chat footer{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
.chat input{
  flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);
  border-radius:7px;color:var(--ink);padding:9px 11px;font-family:inherit;font-size:14px;
}
.chat input::placeholder{color:var(--ink-faint)}
.chat button.send{
  background:var(--accent);border:0;border-radius:7px;color:var(--on-accent);
  font-weight:700;padding:0 15px;font-size:13.5px;
}
.chat .off{padding:11px 13px;font-size:13px;color:var(--ink-faint);border-top:1px solid var(--line)}

/* ── 종료/로그 ─────────────────────────── */
.done{display:none;margin:40px auto;max-width:640px;text-align:center}
.done.on{display:block}
.done h2{font-size:20px;margin:0 0 10px}
.done p{color:var(--ink-dim);margin:0 0 20px}
.logbox{
  width:100%;height:260px;background:var(--code-bg);border:1px solid var(--line);
  border-radius:9px;color:var(--code-ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;padding:12px;resize:vertical;text-align:left;
}
.done .acts{display:flex;gap:9px;justify-content:center;margin-top:12px}
.done .acts button{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:7px;padding:8px 15px;font-size:13.5px;
}
.done .acts button:hover{color:var(--ink)}

@media (max-width:860px){
  .watch.on{grid-template-columns:minmax(0,1fr)}
  .chat{height:min(60vh,460px)}
  /* 좁은 화면에서는 영상 위에 겹치지 않습니다. 딜레마 본문이 3줄이라
     16:9 영역 안에 들어가지 않고, 겹치면 질문 첫 줄부터 잘립니다. */
  .poll{
    position:static;margin-top:10px;max-width:none;padding:12px 13px;
    left:auto;right:auto;bottom:auto;backdrop-filter:none;
  }
  .poll-body{font-size:12.5px}
  .poll-opts{gap:7px}
  .poll-opts button{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<body>

<!-- ══ 실험자 패널 (참가자에게는 접힌 상태로 제공) ══ -->

<!-- ══ 플랫폼 헤더 ══ -->

<div class="wrap">

    <div class="intro-id">
      <label for="pidEmail">참가자 고유 코드(없을 경우 이메일주소)를 입력해주세요.</label>
      <input id="pidEmail" type="text" autocomplete="off"
             placeholder="예: P017 또는 example@gmail.com" spellcheck="false">
      <span class="id-note" id="idNote">설문 응답과 연결하는 데만 씁니다.</span>
    </div>
    <button class="intro-go" id="introGo">시작하기</button>
  </section>


  <!-- ══ 시청 화면 ══ -->
  <section class="watch" id="watch">
    <div class="stage">

           이 상자 기준으로 영상 아래쪽에 겹치고, 좁은 화면에서는 아래로 흐릅니다. -->
      <div class="playwrap">
      <div class="player" id="player">
        <div class="live"><span class="dot"></span>LIVE</div>
        <span class="ph-tag">영상 자리 · 실제 클립으로 교체</span>
        <div class="live-stat" id="liveStat"></div>
        <div class="scene">
          <svg viewBox="0 0 300 190" aria-hidden="true">

            <rect x="196" y="36" width="74" height="52" rx="3" fill="var(--svg-prop)"/>
            <rect x="34" y="60" width="48" height="66" rx="4" fill="var(--svg-prop)"/>
            <path d="M104 150c0-28 18-46 46-46s46 18 46 46z" fill="var(--svg-body)"/>
            <circle cx="150" cy="78" r="27" fill="var(--svg-head)"/>
            <circle cx="140" cy="74" r="2.6" fill="var(--svg-dark)"/>

      </div>

      <div class="info">

        <div class="row">

          <span class="cnt" id="watchCnt"></span>
          <span class="cnt" id="watchAi"></span>
          <!-- 반응 버튼. 누르라고 유도하지 않고 자리만 둡니다 — 노트의
               "명시적으로 행동을 강요하지말고" 반영. -->
          <span class="reacts">
            <button class="react" id="reactUp" aria-pressed="false" aria-label="좋아요" title="좋아요">
              <svg class="th" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h3.5v11H3a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M8.5 21V10.4l3.8-6.8a1.5 1.5 0 0 1 2.8.9L14.3 9h5.4a1.9 1.9 0 0 1 1.85 2.3l-1.6 7.5A2 2 0 0 1 18 21H8.5z"/></svg><span class="rc" id="rcUp"></span>
            </button>
            <button class="react down" id="reactDown" aria-pressed="false" aria-label="싫어요" title="싫어요">
              <svg class="th" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h3.5v11H3a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M8.5 21V10.4l3.8-6.8a1.5 1.5 0 0 1 2.8.9L14.3 9h5.4a1.9 1.9 0 0 1 1.85 2.3l-1.6 7.5A2 2 0 0 1 18 21H8.5z"/></svg><span class="rc" id="rcDown"></span>
            </button>
          </span>
          <button class="sub" id="subBtn" aria-pressed="false">구독</button>
          <button class="leave" id="leave">방송 나가기</button>
        </div>
      </div>
    </div>

    <aside class="chat">
      <header>실시간 채팅 <span class="aiq" id="chatAi"></span></header>
      <div class="feed" id="feed"></div>

      </footer>

    </aside>

  <!-- ══ 종료 ══ -->

</div>

<!-- 채팅 사용자 카드. 실제 스트리밍 플랫폼처럼 프로필을 올리거나 닉네임을 누르면 뜹니다. -->
<div class="ucard" id="ucard" hidden>

<script>
/* ═══════════════════════════════════════════
   모듈 구성은 스펙 문서의 구조도를 그대로 따릅니다.
   ConditionRouter → {ScriptSource|LiveSource} → IdentityAssigner → Renderer
                                              ↘ Logger
   ═══════════════════════════════════════════ */

/* ── 1. 조건 라우터 ───────────────────────── */
const ConditionRouter = (() => {
  const DEF = {
    label:'mixed', ratio:100, viewers:1243, input:'on', seed:7, pid:'TEST',
    cong:'all',           // study 2 일치도: all | half | none (참가자 투표 기준)
    why:'on',             // 참가자에게 선택 이유를 쓰게 할지
    pollwin:0,            // 투표 제한 시간(초). 0이면 제한 없음 — 파일럿 기본값.
                          // 본실험에서는 파일럿에서 나온 분포로 값을 정해 넣습니다.
    theme:'light',        // light | dark — 전 조건 동일하게 고정해 쓸 것
    intro:'on'            // 자극물 전 안내 페이지 표시 여부
  };
  /* 조건 코드. 주소에 cong=half처럼 그대로 쓰면 참가자가 보고 조작을 알아챕니다.
     설문 플랫폼에서는 ?pid=P017&c=k3 형태로 넘기고, 여기서 조건으로 풉니다.
     코드는 의미가 드러나지 않게 섞어 두었습니다. */
  const CODES = {
    q7: {cong:'all',  label:'mixed'},
    m2: {cong:'half', label:'mixed'},
    z5: {cong:'none', label:'mixed'},
    b9: {cong:'all',  label:'human'},
    k3: {cong:'half', label:'human'},
    r6: {cong:'none', label:'human'}
  };

  function read(){
    const q = new URLSearchParams(location.search);
    const c = {...DEF};
    // 코드가 있으면 먼저 적용하고, 개별 파라미터로 덮어쓸 수 있게 둡니다(점검용)
    const code = q.get('c');
    if (code && CODES[code]) Object.assign(c, CODES[code], {code});
    for (const k of Object.keys(DEF)){
      if (!q.has(k)) continue;
      const v = q.get(k);
      c[k] = (k==='ratio'||k==='viewers'||k==='seed'||k==='study'||k==='pollwin')
        ? Number(v) : v;
    }
    if (!['human','mixed'].includes(c.label)) c.label = DEF.label;
    if (!['all','half','none'].includes(c.cong)) c.cong = DEF.cong;
    if (!['on','off'].includes(c.why)) c.why = DEF.why;
    if (!Number.isFinite(c.pollwin) || c.pollwin < 0 || c.pollwin > 90) c.pollwin = DEF.pollwin;
    if (!['light','dark'].includes(c.theme)) c.theme = DEF.theme;
    if (!['on','off'].includes(c.intro)) c.intro = DEF.intro;
    if (!Number.isFinite(c.ratio) || c.ratio<0 || c.ratio>100) c.ratio = DEF.ratio;
    if (!Number.isFinite(c.viewers) || c.viewers<1) c.viewers = DEF.viewers;
    if (!Number.isFinite(c.seed) || c.seed<1) c.seed = DEF.seed;
    // 전원 사람 조건에서는 AI 비율이 의미가 없습니다
    if (c.label === 'human') c.ratio = 0;
    return c;
  }
  return {read, id:c => `${c.cong}-${c.label}-${c.ratio}-${c.viewers}-${c.seed}`};
})();

let cond = ConditionRouter.read();

/* ── 2. 발화 풀 ───────────────────────────── */
/* 본문 발화 — 순서 고정. 규모가 작을수록 이 비중이 높습니다. */
/* ① 입장~예고 구간. **순서대로** 재생되므로 한 편의 대화처럼 읽히게 섞어 씁니다.

   시점은 **4시간 방송의 3시간 30분쯤**입니다. 오래 있던 사람들의 채팅이라
   인사나 "소리 괜찮나요" 같은 입장 직후 말투는 넣지 않습니다.
   방종 각을 잡는 분위기가 깔리되 **아직 끝난다고 말한 적은 없습니다** —
   "오늘 여기까지" 같은 확정 멘트는 ③ 마무리 구간에 둡니다.

   영상이 아직 플레이스홀더라 주제에 의존하지 않는 줄만 씁니다.
   딜레마를 암시하는 줄은 절대 넣지 않습니다 — 투표 전에 주제가 새면 사전 의견이 오염됩니다. */
const SCRIPT = [
  'ㅋㅋㅋㅋ','아까 그거 아직도 웃김','ㅇㅇ','벌써 3시간이네','시간 왜 이렇게 빨라',
  'ㅋㅋㅋ','또 그 얘기ㅋㅋ','나왔다','ㅇㅈ','오늘 길게 하시네',
  '목 안 아프세요','물 좀 드세요','물물','많이 하셨다','ㅎㅎ',
  '아까 얘기 또 생각남','그거 진짜였어요?','ㅋㅋㅋㅋㅋㅋ','아 ㅋㅋ','맞아요',
  '슬슬 마무리 분위기','아직 아니죠?','좀만 더요','ㅠㅠ','아쉽다',
  '저 아직 있어요','ㅇㅇ 보고있음','조용히 보는중','ㅎㅎㅎ','ㅇㅋ',
  '배고프다','야식 참는중','치킨','치킨ㄱㄱ','ㅋㅋㅋㅋ',
  '아 나 내일 일찍 일어나야 하는데','저도요','같이 버텨요','ㅋㅋㅋㅋㅋ','ㅇㅈㅇㅈ',
  '방금 들어왔는데 무슨 얘기중','아 요약좀','ㅋㅋㅋ 설명 불가','그냥 보세요','ㅇㅇ',
  '아까부터 계속 웃고있음','표정 좋아지셨다','아까보다 기운 나셨네','ㅎㅎ','오',
  '마지막으로 뭐 하나 더 해주세요','ㅇㅈ','저도 그거 궁금','ㄱㄱ','ㅋㅋㅋㅋ',
  '목소리 많이 쉬셨네','쉬엄쉬엄 하세요','ㅇㅇ','진짜요?','우와',
  '아 그거 아까 나왔는데','ㅋㅋ 또 나옴','ㅇㅋㅇㅋ','ㅎㅎ','ㅋㅋㅋ'
];

/* 짧은 반응 — 규모가 커질수록 채팅의 대부분을 차지합니다. */
const REACTIONS = ['ㅋㅋㅋ','ㅇㅇ','ㅠㅠ','ㅋㅋㅋㅋㅋ','와','헐','ㅇㅈ','ㄹㅇ','ㅎㅎ','오',

/* 짧은 리액션은 반복돼도 자연스럽지만, 같은 게 연달아 나오면 티가 납니다.
   직전 4개 안에 쓴 것은 다시 뽑지 않습니다. */
const recentReacts = [];
function pickReact(rnd){
  let v = REACTIONS[Math.floor(rnd() * REACTIONS.length)];
  for (let g = 0; g < 8 && recentReacts.includes(v); g++){
    v = REACTIONS[Math.floor(rnd() * REACTIONS.length)];
  }
  recentReacts.push(v);
  if (recentReacts.length > 4) recentReacts.shift();
  return v;
}

const STREAM_TITLE = '같이 판단 좀 해줘라';

/* ── 2-1. 밀도 모델 ──────────────────────────
   Flores-Saviaga et al. (2019) HT'19 규모별 실측치를 구간별 로그-로그 보간.
   앵커 — 클러스터2 중앙(≈940명) 0.57 msg/s, 클러스터3 중앙(≈4,790명) 1.95 msg/s,
          클러스터5(21,678명+) 2.45 msg/s.
   단일 멱함수로는 4,790명 이후의 완만한 구간이 재현되지 않아(6,500명에서 조기 포화)
   구간을 나눴습니다. 4,790명 위쪽이 완만한 것은 수식의 한계가 아니라 실측 그대로이며,
   포화는 문서대로 21,678명에서 일어납니다.
   시청자 수에 종속된 고정 함수이며 실험자가 따로 조작하지 않습니다.      */
function density(v){
  const rate = v <= 4790
    ? 0.57 * Math.pow(v / 940, 0.755)        // 클러스터 2→3 구간: 가파름
    : Math.min(2.45, 1.95 * Math.pow(v / 4790, 0.151)); // 3→5 구간: 완만, 21,678명에서 포화
  const chatters = Math.max(2, Math.round(Math.pow(v, 0.42)));
  // 규모가 커질수록 짧은 반응 비중 상승 (문장 길이 6단어 → 3.8단어 경향)
  const reactShare = Math.min(0.8, Math.max(0.1, (rate - 0.1) / 2.6));
  return {rate, chatters, reactShare};
}

/* 입장 직전까지 보이는 대화 줄 수. 시청자가 적으면 그만큼 줄어듭니다. */
const BACKLOG_N = 14;

/* ── 2-2. 타임라인 생성 ──────────────────────
   텍스트·타이밍·화자 구조만 결정하고 정체성(사람/AI)은 붙이지 않습니다.
   따라서 label·ratio를 바꿔도 이 결과물은 한 글자도 변하지 않습니다.     */
function buildTimeline(c, rnd, span){
  recentReacts.length = 0;
  const d = density(c.viewers);
  // 발화량 편중 — 소수 화자가 대화를 독점 (클리크 스트림의 1인당 36메시지 특성)
  const w = [];
  for (let i = 0; i < d.chatters; i++) w.push(1 / Math.pow(i + 1, 0.7));
  const wsum = w.reduce((a, b) => a + b, 0);
  const pickChatter = () => {
    let x = rnd() * wsum;
    for (let i = 0; i < w.length; i++){ x -= w[i]; if (x <= 0) return i; }
    return w.length - 1;
  };
  const list = [];
  const counts = new Array(d.chatters).fill(0);
  let si = 0;

  /* 입장 직전까지 흘렀던 대화를 같은 타임라인의 앞부분으로 만듭니다.
     따로 뽑으면 백로그에서 쓴 줄이 입장 직후 다시 나와 반복 구간이 생깁니다.
     한 대본을 이어서 쓰면 백로그와 그 이후가 한 편의 대화가 됩니다. */
  const preN = Math.max(5, Math.min(BACKLOG_N,
    Math.round(BACKLOG_N * Math.min(1, c.viewers / 600))));
  for (let k = 0; k < preN; k++){
    const useReact = si >= SCRIPT.length || rnd() < d.reactShare;
    const ci = pickChatter();
    counts[ci]++;
    list.push({t: 0, text: useReact ? pickReact(rnd) : SCRIPT[si++],
               ci, body: false, pre: true});
  }

  let t = 1.5;
  while (t < span){
    const useReact = si >= SCRIPT.length || rnd() < d.reactShare;
    const text = useReact ? pickReact(rnd) : SCRIPT[si++];
    const ci = pickChatter();
    counts[ci]++;
    // body = 본문 발화. study 2에서 이 자리만 입장(찬/반) 슬롯이 됩니다.
    list.push({t: +t.toFixed(2), text, ci, body: !useReact});
    // 포아송 도착 — 간격이 규칙적이지 않게
    t += Math.max(0.2, Math.min(-Math.log(1 - rnd()) / d.rate, 45));
  }
  return {list, counts, d};
}

/* ── 2-3. Study 2: 입장 슬롯 배정 ─────────────
   본문 발화 자리에 '참가자와 일치 / 불일치' 슬롯을 깔아둡니다. 실제 텍스트는
   참가자가 투표한 뒤에 결정되므로, 이 단계에서는 어느 쪽인지 모르는 상태로
   비율만 맞춥니다. 타이밍·화자 구조는 일치도 조건과 무관하게 동일합니다.   */
function applyStanceSlots(list, c, rnd){
  const share = c.cong === 'all' ? 1 : c.cong === 'half' ? 0.5 : 0;
  const bodyIdx = [];
  list.forEach((m, i) => { if (m.body) bodyIdx.push(i); });

  const order = [...bodyIdx];
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const nCong = Math.round(bodyIdx.length * share);
  const congSet = new Set(order.slice(0, nCong));

  let k = 0;
  for (const i of bodyIdx){
    list[i].slot = congSet.has(i) ? 'cong' : 'incong';
    list[i].ri = k++;                    // 이유 풀에서 몇 번째를 쓸지 (결정적)
  }
  /* 반응 자리 일부를 딜레마용 중립 잡담으로 교체 — 전부 'ㅋㅋㅋ'면 토론장처럼 안 보입니다.
     단 투표가 끝난 뒤의 자리에만 넣습니다. 투표 전에 "이거 맨날 싸우는 주제" 같은 줄이
     흐르면 주제가 미리 새서 사전 의견이 오염됩니다. */
  list.forEach((m) => {
    if (!m.body && m.t >= POLL_AT && rnd() < 0.22){
      m.text = DILEMMA.neutral[Math.floor(rnd() * DILEMMA.neutral.length)];
    }
  });
  return {bodySlots: bodyIdx.length, congSlots: nCong};
}

/* 투표가 들어온 뒤 슬롯을 실제 문장으로 바꿉니다. */
function resolveStance(m, vote){
  if (!m.slot) return {text: m.text, stance: null, ri: 0};
  const side = m.slot === 'cong' ? vote : (vote === 'A' ? 'B' : 'A');
  const pool = side === 'A' ? DILEMMA.reasonsA : DILEMMA.reasonsB;
  return {text: pool[m.ri % pool.length], stance: side, ri: m.ri};
}

/* 이유를 숨기는 조건에서 쓰는 짧은 표현 — 입장만 드러나고 논거는 안 보입니다. */
const SHORT_STANCE = ['이쪽', 'ㅇㅇ 이거', '나도 이거', '이게 맞음', '동의', '이쪽이지'];

/* ── 3. 댓글 출처 (동일 인터페이스: next(t)) ── */
function ScriptSource(c, rnd, span){
  const built = buildTimeline(c, rnd, span);
  // study 2는 본문 자리에 입장 슬롯을 깔아둡니다 (텍스트는 투표 후 결정)
  const slots = applyStanceSlots(built.list, c, rnd);
  const pre = built.list.filter(m => m.pre);
  let i = pre.length;                    // 재생은 백로그 다음부터
  return {
    kind:'script',
    info: built.d,
    counts: built.counts,
    slots,
    pre,
    total: built.list.length,
    next(t){
      const out = [];
      while (i < built.list.length && built.list[i].t <= t){ out.push(built.list[i]); i++; }
      return out;
    },
    note(){ return '고정 스크립트'; }
  };
}

/* 실시간 생성 — 운영본에서는 /api/generate 호출.
   이 프로토타입은 정적 페이지라 서버가 없으므로 변주만 흉내냅니다. */
function LiveSource(c, rnd, span, ctx){
  const base = ScriptSource(c, rnd, span);
  const TAILS = ['','!','~','ㅋㅋ','...','?'];
  let n = 0;
  return {
    kind:'live',
    info: base.info,
    counts: base.counts,
    slots: base.slots,
    total: base.total,
    next(t){
      return base.next(t).map(m => {
        n++;
        const last = ctx.lastUserMessage;
        if (last && n % 4 === 0){ ctx.lastUserMessage = null; return {...m, text: `${last} ㄹㅇ`}; }
        return {...m, text: m.text + TAILS[n % TAILS.length]};
      });
    },
    note(){ return '실시간 생성(모의)'; }
  };
}

   실제 이용자의 닉네임을 그대로 쓰지 않습니다. 실존 계정에 하지 않은 말을

function makeNick(rnd){
  const pickOf = a => a[Math.floor(rnd() * a.length)];
  const d = n => String(Math.floor(rnd() * n));
  const pad = n => d(n).padStart(String(n - 1).length, '0');

  /* 숫자 꼬리. 유형마다 붙는 비율이 다릅니다 —
     영타 한글과 아이디형은 거의 붙고, 한글 단어는 덜 붙습니다. */
  const tail = (p) => {
    if (rnd() >= p) return '';
    const r = rnd();
    if (r < 0.34) return pad(100);                       // 두 자리 (07, 42)
    if (r < 0.62){                                       // 출생연도 느낌 (97, 03)
      const y = Math.floor(rnd() * 15);                  // 0~14 → 90~99, 00~04
      return y < 10 ? String(90 + y) : '0' + (y - 10);
    }
    if (r < 0.86) return String(1000 + Math.floor(rnd() * 9000));  // 네 자리 (2447)
    return d(10);                                        // 한 자리
  };

  const r = rnd();
  let acc = NICK_MIX.word;
  if (r < acc) return pickOf(NICK_WORD) + tail(0.30);

  acc += NICK_MIX.roman;
  if (r < acc) return pickOf(NICK_ROMAN) + tail(0.88);

  acc += NICK_MIX.en;
  if (r < acc){
    const base = pickOf(NICK_EN);
    // 영문은 가끔 언더스코어가 들어갑니다
    return rnd() < 0.18 ? base + '_' + pickOf(NICK_EN) : base + tail(0.78);
  }

  acc += NICK_MIX.id;
  if (r < acc) return pickOf(NICK_IDA) + pickOf(NICK_IDB) + tail(0.72);

  return pickOf(NICK_FAN) + tail(0.18);
}

/* AI 닉네임은 봇처럼 보이는 형태로 유지 */

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* AI 배정은 화자 수가 아니라 *발화량* 기준으로 목표 비율에 맞춥니다.
   화자 수 기준으로 반올림하면 소규모에서 오차가 큽니다 — 화자 5명에 30%를
   적용하면 round(1.5)=2, 즉 실제로는 40%가 됩니다. 게다가 발화량이 앞 순번
   화자에게 몰려 있어 참가자가 보는 메시지 기준 비율은 더 크게 어긋납니다.
   그래서 섞은 순서대로 훑으며 목표 발화 비율에 가까워질 때만 AI로 지정합니다. */
const BRUTE_MAX = 18;   // 이 수 이하의 화자면 전수 탐색 (2^18 = 262,144)

function IdentityAssigner(c, nChatters, counts){
  const rnd = mulberry32(c.seed * 9301 + 49297);
  const cnt = counts && counts.length === nChatters
    ? counts : new Array(nChatters).fill(1);
  const totalMsg = cnt.reduce((a, b) => a + b, 0) || 1;

  const idx = [...Array(nChatters).keys()];
  for (let i = idx.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }

  const aiSet = new Set();
  let acc = 0, method = 'none';
  if (c.label === 'mixed' && c.ratio > 0){
    const targetMsg = totalMsg * c.ratio / 100;
    const targetSize = nChatters * c.ratio / 100;
    const rnd2 = mulberry32(c.seed * 2654435761 + nChatters);  // 동점 처리 전용

    if (nChatters <= BRUTE_MAX){
      /* 전수 탐색 — greedy는 섞인 순서상 앞쪽에 발화량이 큰 화자가 오면
         되돌리지 못해 소규모에서 오차가 크게 벌어집니다.
         조합이 2^18 이하면 전부 따져보고 목표에 가장 가까운 집합을 씁니다. */
      const M = 1 << nChatters;
      const sums = new Float64Array(M), sizes = new Uint8Array(M);
      for (let m = 1; m < M; m++){
        const lb = m & -m, i = 31 - Math.clz32(lb);
        sums[m] = sums[m ^ lb] + cnt[i];
        sizes[m] = sizes[m ^ lb] + 1;
      }
      let best = 0, bd = Math.abs(0 - targetMsg), bs = Math.abs(0 - targetSize), ties = 1;
      for (let m = 1; m < M; m++){
        const d = Math.abs(sums[m] - targetMsg);
        const s = Math.abs(sizes[m] - targetSize);
        if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && s < bs - 1e-9)){
          best = m; bd = d; bs = s; ties = 1;
        } else if (Math.abs(d - bd) < 1e-9 && Math.abs(s - bs) < 1e-9){
          // 동점은 seed로 균등 추첨 — 소규모에서도 seed가 의미를 갖도록
          if (rnd2() < 1 / ++ties) best = m;
        }
      }
      for (let i = 0; i < nChatters; i++) if (best & (1 << i)){ aiSet.add(i); acc += cnt[i]; }
      method = 'exhaustive';
    } else {
      /* 화자가 많으면 조합이 폭발하므로 greedy로 폴백하되, 한 번만 돌리면
         섞인 순서에 따라 오차가 벌어집니다. 순서를 바꿔가며 여러 번 돌리고
         목표에 가장 가까운 결과를 씁니다. */
      let bestSet = null, bestAcc = 0, bd = Infinity;
      const order = [...Array(nChatters).keys()];
      for (let r = 0; r < 64; r++){
        for (let i = order.length - 1; i > 0; i--){
          const j = Math.floor(rnd2() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
        const set = new Set(); let a = 0;
        for (const i of order){
          if (Math.abs(a + cnt[i] - targetMsg) < Math.abs(a - targetMsg)){ set.add(i); a += cnt[i]; }
        }
        const d = Math.abs(a - targetMsg);
        if (d < bd){ bd = d; bestSet = set; bestAcc = a; }
        if (bd === 0) break;
      }
      for (const i of bestSet) aiSet.add(i);
      acc = bestAcc;
      method = 'greedy-restart';
    }
  }

  /* 닉네임은 AI든 사람이든 같은 풀에서 뽑습니다. AI임은 아이콘 라벨 하나로만 표시합니다.
     'AI도우미_03' 같은 이름을 주면 라벨 말고 이름까지 달라져서, 정체성 조작에
     이름의 기계스러움이 섞입니다 — 그러면 아이콘만 바꾸는 설계가 성립하지 않습니다. */
  const roster = [];
  const used = new Set();
  for (let i = 0; i < nChatters; i++){
    let nm = makeNick(rnd), guard = 0;
    while (used.has(nm) && guard++ < 24) nm = makeNick(rnd);   // 같은 닉 중복 방지
    if (used.has(nm)) nm += String(i);
    used.add(nm);
    roster.push({kind: aiSet.has(i) ? 'ai' : 'human', name: nm});
  }
  return {
    roster,
    aiChatters: aiSet.size,
    // 설정값과 실제값의 차이를 로그에 남기기 위한 실측치
    actual: {
      target_ratio: c.label === 'mixed' ? c.ratio : 0,
      method,
      chatter_ratio: +(aiSet.size / nChatters * 100).toFixed(1),
      message_ratio: +(acc / totalMsg * 100).toFixed(1),
      ai_chatters: aiSet.size,
      chatters: nChatters,
      ai_messages: acc,
      total_messages: totalMsg
    },
    assign(m){
      const p = roster[m.ci % roster.length];
      return {...m, kind: p.kind, name: p.name};
    }
  };
}

const feed = document.getElementById('feed');
/* ── 채팅 사용자 카드 ────────────────────
   실제 플랫폼처럼 프로필을 올리거나 닉네임을 누르면 그 사용자 정보가 뜹니다.
   조작(사람/AI)을 한 번 더 노출하는 자리이면서, 어떤 사용자를 들여다봤는지가
   그대로 로그에 남습니다.
   주의: 호버는 비용이 0이라 '정보를 찾아본 행동'으로 해석하지 않습니다
   (Kang et al. 2009는 희소 자원 지불이 전제). 클릭은 비용이 있어 구분해 남깁니다. */
const userStats = {};
const uc = {el: null, who: null, since: 0, how: null};

function userRows(name, isAI){
  const st = userStats[name] || (userStats[name] = {msgs: 0, first_at: null, opens: 0});
  return [
    ['유형', isAI ? 'AI 시청자' : '실제 이용자', isAI],
    ['이 방송 채팅', `${st.msgs}개`, false],
    ['첫 채팅', st.first_at === null ? '-' : `${Math.round(st.first_at)}초`, false]
  ];
}

function showUserCard(anchor, name, isAI, how){
  const st = userStats[name] || (userStats[name] = {msgs: 0, first_at: null, opens: 0});
  st.opens++;
  const card = $('ucard');
  $('ucIc').className = 'uc-ic' + (isAI ? ' ai' : '');
  $('ucIc').textContent = isAI ? 'AI' : name.slice(0, 2).toUpperCase();
  $('ucNm').textContent = name;
  $('ucRows').innerHTML = userRows(name, isAI).map(([k, v, ai]) =>
    `<div class="uc-row"><span class="k">${k}</span><span class="v${ai ? ' ai' : ''}">${v}</span></div>`
  ).join('');
  card.hidden = false;
  const r = anchor.getBoundingClientRect();
  const w = card.offsetWidth, h = card.offsetHeight;
  card.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left - w - 10)) + 'px';
  card.style.top  = Math.max(8, Math.min(innerHeight - h - 8, r.top - 4)) + 'px';
  uc.who = name; uc.since = performance.now(); uc.how = how;
  Logger.add('user_card_open', {name, is_ai: isAI, how, at_sec: +tick.toFixed(2), opens: st.opens});
}

function hideUserCard(){
  if (!uc.who) return;
  $('ucard').hidden = true;
  Logger.add('user_card_close', {
    name: uc.who, how: uc.how,
    dur_ms: Math.round(performance.now() - uc.since), at_sec: +tick.toFixed(2)
  });
  uc.who = null;
}

/* 바깥을 누르면 닫습니다 — 클릭으로 연 카드는 호버와 달리 고정됩니다. */
document.addEventListener('click', e => {
  if (uc.who && uc.how === 'click' && !e.target.closest('.ucard') && !e.target.closest('.nm')){
    hideUserCard();
  }
});

const Renderer = {
  push(c){
    const el = document.createElement('div');
    el.className = 'msg' + (c.kind === 'sys' ? ' sys' : '');
    if (c.kind === 'sys'){
      el.append(document.createTextNode(c.text));
      feed.appendChild(el);
      feed.scrollTop = feed.scrollHeight;
      return;
    }
    const ic = document.createElement('span');
    ic.className = 'ic ' + c.kind;
    ic.textContent = c.kind === 'ai' ? 'AI' : (c.kind === 'me' ? '나' : '');
    const nm = document.createElement('span');
    nm.className = 'nm ' + c.kind;
    nm.textContent = c.name;
    el.append(ic, nm);

    if (c.kind !== 'me'){
      const isAI = c.kind === 'ai';
      const st = userStats[c.name] || (userStats[c.name] = {msgs: 0, first_at: null, opens: 0});
      st.msgs++;
      if (st.first_at === null) st.first_at = tick;
      let hoverTimer = 0;
      const open = (how) => showUserCard(nm, c.name, isAI, how);
      // 프로필을 올리면 잠깐 뒤에 뜹니다 — 지나가는 커서에 반응하지 않도록
      [ic, nm].forEach(t => {
        t.addEventListener('mouseenter', () => {
          if (uc.how === 'click') return;
          hoverTimer = setTimeout(() => open('hover'), 220);
        });
        t.addEventListener('mouseleave', () => {
          clearTimeout(hoverTimer);
          if (uc.how === 'hover') hideUserCard();
        });
      });
      // 닉네임을 누르면 고정됩니다
      nm.addEventListener('click', (e) => {
        e.stopPropagation();
        clearTimeout(hoverTimer);
        if (uc.who === c.name && uc.how === 'click'){ hideUserCard(); return; }
        if (uc.who) hideUserCard();
        open('click');
      });
    }
    // study 2: 입장 배지. 이유 노출을 끄면 배지만 남습니다.
    if (c.stance){
      const st = document.createElement('span');
      st.className = 'stance ' + c.stance.toLowerCase();
      st.textContent = c.stance;
      el.append(st);
    }
    el.append(document.createTextNode(c.text));
    feed.appendChild(el);
    if (msgObserver){
      el.__seen = {ms: 0, since: 0, wasVisible: false, stance: c.stance || null,
                   kind: c.kind, el};
      seen.msgs.push(el.__seen);
      msgObserver.observe(el);
    }
    const near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90;
    if (near) feed.scrollTop = feed.scrollHeight;
    /* 스크롤백을 열어둡니다 — 지나간 채팅을 거슬러 읽는 행동 자체가 측정 대상입니다.
       상한은 메모리 보호용이고, 3,180명·180초에서도 600줄을 넘지 않습니다. */
    while (feed.children.length > 600){
      const gone = feed.firstChild;
      if (msgObserver && gone.__seen){
        if (gone.__seen.since){ gone.__seen.ms += performance.now() - gone.__seen.since; gone.__seen.since = 0; }
        msgObserver.unobserve(gone);
      }
      feed.removeChild(gone);
    }
  },
  clear(){
    if (msgObserver) msgObserver.disconnect();
    seen.msgs.length = 0; seen.offscreen = 0;
    feed.innerHTML = '';
    hideUserCard();
    for (const k of Object.keys(userStats)) delete userStats[k];
    initSeen();
  }
};

/* 채팅 스크롤 추적.
   자동 스크롤이 아니라 참가자가 직접 올린 경우만 셉니다. 바닥에서 떨어져 있던
   시간과 가장 멀리 올라간 깊이를 남깁니다 — 지나간 채팅을 거슬러 읽는 행동입니다.
   주의: 스크롤 깊이를 '주의'나 '관심'으로 바로 읽지 않습니다. 열람했다는 사실만 말합니다. */
const scrollStats = {up_events: 0, max_depth_px: 0, away_ms: 0, reached_top: false};
function initChatScroll(){
  const el = feed;
  let lastTop = 0, awaySince = 0, settle = 0;
  el.addEventListener('scroll', () => {
    const depth = el.scrollHeight - el.scrollTop - el.clientHeight;
    const away = depth > 90;
    if (el.scrollTop < lastTop - 2) scrollStats.up_events++;   // 위로 올린 경우만
    lastTop = el.scrollTop;
    if (depth > scrollStats.max_depth_px) scrollStats.max_depth_px = Math.round(depth);
    if (el.scrollTop <= 2 && el.scrollHeight > el.clientHeight + 10) scrollStats.reached_top = true;
    if (away && !awaySince) awaySince = performance.now();
    if (!away && awaySince){ scrollStats.away_ms += performance.now() - awaySince; awaySince = 0; }
    clearTimeout(settle);
    settle = setTimeout(() => {
      if (awaySince) scrollStats.away_ms += performance.now() - awaySince;
      if (awaySince) awaySince = performance.now();
      Logger.add('chat_scroll', {
        at_sec: +tick.toFixed(2), depth_px: Math.round(depth),
        up_events: scrollStats.up_events, reached_top: scrollStats.reached_top
      });
    }, 500);   // 연속 스크롤은 한 건으로 묶습니다
  }, {passive: true});
}

/* ── 메시지별 화면 체류 ──────────────────────
   comment_shown은 '피드에 붙었다'는 사실일 뿐 본 것이 아닙니다.
   스크롤이 위에 가 있으면 새 메시지는 화면 밖에 쌓이고, 밀도가 높으면
   읽기 전에 밀려 올라가고, 탭을 가린 동안에도 계속 쌓입니다.

   채팅창 안에 실제로 들어와 있던 시간만 누적합니다. 탭이 가려진 구간은 제외합니다.
   이벤트는 늘리지 않고 내부에 모았다가 종료 요약에 한 번만 내보냅니다.

   한계: 화면에 있었다 ≠ 읽었다. 시선 추적 없이는 그 이상 불가.
         논문에는 '읽은 메시지'가 아니라 '화면 노출 시간'으로 기술. */
const SEEN_MIN_MS = 1000;        // 이 시간 이상 떠 있어야 '봤다'로 셉니다
const seen = {msgs: [], offscreen: 0};
let msgObserver = null;

function nowVisible(){ return document.visibilityState === 'visible'; }

function initSeen(){
  if (!('IntersectionObserver' in window)) return;   // 미지원 브라우저는 집계 생략
  msgObserver = new IntersectionObserver((entries) => {
    const now = performance.now();
    for (const e of entries){
      const rec = e.target.__seen;
      if (!rec) continue;
      if (e.isIntersecting){
        if (!rec.since) rec.since = now;
      } else if (rec.since){
        if (nowVisible()) rec.ms += now - rec.since;
        rec.since = 0;
      }
    }
  }, {root: feed, threshold: 0.6});                  // 줄의 60% 이상 보여야 인정
}

/* 탭을 가리면 그 순간까지만 적립하고 멈춥니다. 돌아오면 다시 시작합니다. */
function pauseSeen(stop){
  const now = performance.now();
  for (const r of seen.msgs){
    if (!r.since) continue;
    if (stop){ r.ms += now - r.since; r.since = 0; r.wasVisible = true; }
  }
  if (!stop){
    for (const r of seen.msgs) if (r.wasVisible && r.el.isConnected){ r.since = now; r.wasVisible = false; }
  }
}

/* 종료 시 집계. 입장(stance)·정체성(kind)별로 나눠 내보냅니다. */
function seenSummary(){
  const now = performance.now();
  const vis = nowVisible();
  let n = 0, cong = 0, incong = 0, msCong = 0, msIncong = 0, off = 0, msAll = 0;
  for (const r of seen.msgs){
    let ms = r.ms;
    if (r.since && vis) ms += now - r.since;          // 아직 화면에 있는 것도 반영
    msAll += ms;
    if (ms < SEEN_MIN_MS){ if (ms === 0) off++; continue; }
    n++;
    if (r.stance){
      if (r.stance === vote){ cong++; msCong += ms; } else { incong++; msIncong += ms; }
    }
  }
  const tot = cong + incong;
  /* shown_* 과 lines_* 는 세는 대상이 다릅니다.
     shown_*  타임라인 발화만 (백로그·예고 반응·참가자 본인 글 제외)
     lines_*  채팅창에 들어온 모든 줄
     둘을 직접 빼지 마십시오. 비교는 입장(stance) 기준 필드로만 하십시오. */
  return {
    lines_total: seen.msgs.length,                     // 피드에 들어온 모든 줄
    lines_seen: n,                                     // 그중 1초 이상 화면에 있던 줄
    lines_offscreen: off,                              // 한 번도 화면에 안 뜬 줄
    visible_ms_total: Math.round(msAll),
    seen_congruent: cong,
    seen_incongruent: incong,
    seen_congruence_ratio: tot ? +(cong / tot * 100).toFixed(1) : null,
    visible_ms_congruent: Math.round(msCong),
    visible_ms_incongruent: Math.round(msIncong),
    threshold_ms: SEEN_MIN_MS
  };
}

/* 채팅 텍스트를 드래그해서 읽는 행동. 복사하려는 것일 수도, 한 줄을 짚어가며
   읽는 것일 수도 있습니다. 어느 쪽인지는 해석하지 않고 사실만 남깁니다.
   선택이 끝난 시점(mouseup/touchend)에 한 번만 기록합니다. */
function initTextSelect(){
  const record = () => {
    const sel = document.getSelection();
    if (!sel || sel.isCollapsed) return;
    const txt = sel.toString().trim();
    if (txt.length < 2) return;
    const node = sel.anchorNode;
    const el = node && (node.nodeType === 1 ? node : node.parentElement);
    const msg = el && el.closest('.msg');
    const inChat = Boolean(el && el.closest('.chat'));
    Logger.add('text_select', {
      at_sec: +tick.toFixed(2),
      where: inChat ? 'chat' : (el && el.closest('.poll') ? 'poll' : 'other'),
      chars: txt.length,
      text: txt.slice(0, 120),
      msg_name: msg ? (msg.querySelector('.nm') || {}).textContent || null : null,
      msg_kind: msg ? (msg.querySelector('.ic') ? msg.querySelector('.ic').className.replace('ic ', '') : null) : null
    });
  };
  document.addEventListener('mouseup', () => setTimeout(record, 0));
  document.addEventListener('touchend', () => setTimeout(record, 0), {passive: true});
}

/* ── 6. 로거 ─────────────────────────────── */
/* ════════════════════════════════════════════════════════════════
   배포 설정 — 여기 두 줄만 채우면 로그가 Supabase로 들어갑니다.
   비워두면 로컬에만 쌓이고 실험자 패널에서 JSON으로 내려받습니다.
   anon key는 공개되어도 되는 값입니다. RLS로 insert만 허용하고
   select는 막아두면 참가자가 남의 로그를 읽을 수 없습니다(README 참고).
   ════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = '';       // 예: https://xxxxxxxx.supabase.co
const SUPABASE_KEY = '';       // 예: eyJhbGciOi... (anon public key)

const Sink = (function(){
  const on = () => Boolean(SUPABASE_URL && SUPABASE_KEY);
  const QKEY = 'stim_retry_q';
  let sessionId = null, queue = [], sending = false;

  /* 전송 실패분은 브라우저에 쌓아두고 다음 기회에 다시 보냅니다.
     저장소가 막힌 환경(시크릿 창 등)에서도 자극물은 그대로 돌아가야 하므로 전부 try/catch. */
  const readQ = () => { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch { return []; } };
  const writeQ = q => { try { localStorage.setItem(QKEY, JSON.stringify(q.slice(-4000))); } catch {} };

  async function post(path, body, beacon){
    const url = `${SUPABASE_URL}/rest/v1/${path}`;
    const headers = {
      'Content-Type': 'application/json',
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      Prefer: 'return=minimal'
    };
    if (beacon && navigator.sendBeacon){
      /* 창을 닫는 순간에는 fetch가 중간에 끊깁니다. keepalive로 보내고
         그래도 실패하면 재시도 큐에 남습니다. */
      try {
        const r = await fetch(url, {method:'POST', headers, body: JSON.stringify(body), keepalive: true});
        return r.ok;
      } catch { return false; }
    }
    try {
      const r = await fetch(url, {method:'POST', headers, body: JSON.stringify(body)});
      return r.ok;
    } catch { return false; }
  }

  return {
    enabled: on,
    /* 세션 1건을 먼저 만들고, 이후 이벤트는 이 id에 묶습니다. */
    async open(pid, condition){
      sessionId = (crypto.randomUUID ? crypto.randomUUID()
        : 'sid-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10));
      const row = {
        id: sessionId, pid, condition,
        started_at: new Date().toISOString(),
        user_agent: navigator.userAgent,
        screen_w: screen.width, screen_h: screen.height,
        viewport_w: innerWidth, viewport_h: innerHeight,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone
      };
      if (!on()) return sessionId;
      if (!await post('sessions', row)) { const q = readQ(); q.push({p:'sessions', b:row}); writeQ(q); }
      return sessionId;
    },
    id: () => sessionId,
    /* 세션 행은 입장 전에 이미 만들어집니다. 안내 페이지에서 이메일을 받으면
       그 행을 채워 넣습니다 — 중간에 창을 닫아도 세션 자체는 남게 하려는 구조입니다. */
    async setPid(pid){
      if (!on() || !sessionId) return;
      const url = `${SUPABASE_URL}/rest/v1/sessions?id=eq.${sessionId}`;
      try {
        await fetch(url, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            Prefer: 'return=minimal'
          },
          body: JSON.stringify({pid})
        });
      } catch {}
    },
    /* 이벤트는 모아서 보냅니다. 한 건씩 보내면 300명 × 수천 건이 전부 개별 요청이 됩니다. */
    push(ev){ queue.push({session_id: sessionId, t: ev.t, type: ev.type, data: ev}); },
    async flush(final){
      if (!on()){ queue = []; return; }
      if (sending && !final) return;
      sending = true;
      const batch = queue.splice(0, queue.length);
      if (batch.length && !await post('events', batch, final)){
        const q = readQ(); q.push({p:'events', b:batch}); writeQ(q);
      }
      if (!final){
        /* 지난번에 실패한 것들을 한 묶음씩 다시 시도 */
        const q = readQ();
        if (q.length){
          const item = q[0];
          if (await post(item.p, item.b)){ q.shift(); writeQ(q); }
        }
      }
      sending = false;
    }
  };
})();

const Logger = {
  ev: [],
  t0: null,
  start(){
    this.ev = [];
    this.t0 = Date.now();
    Sink.open(cond.pid, cond);
    this.add('session_start', {cond});
  },
  add(type, data = {}){
    const ev = {t: this.t0 ? +((Date.now() - this.t0) / 1000).toFixed(2) : 0, type, ...data};
    this.ev.push(ev);
    Sink.push(ev);
  },
  dump(){
    return JSON.stringify({
      pid: cond.pid, session_id: Sink.id(), condition: cond, events: this.ev
    }, null, 2);
  }
};

/* 5초마다, 그리고 창을 닫거나 탭을 가릴 때 전송합니다. */
setInterval(() => Sink.flush(false), 5000);
addEventListener('visibilitychange', () => {
  pauseSeen(document.visibilityState !== 'visible');
  Logger.add('visibility', {state: document.visibilityState});
  if (document.visibilityState === 'hidden') Sink.flush(true);
});
addEventListener('pagehide', () => { Logger.add('page_hide'); Sink.flush(true); });

/* ── 7. 플레이 루프 ──────────────────────── */
const SPAN = 240;          // 영상 길이(초). 실제 클립 확정 시 교체.
/* 마무리 구간. 스트리머가 방송을 접으려 하는 시점과 실제로 끊기는 시점입니다.
   끊긴 뒤 추천 화면에서 구독·다음 영상 클릭이 측정됩니다 —
   "갈 때 붙잡는가"가 이 자극물의 마지막 행동 지표입니다. */
const OUTRO_AT = 200;      // 스트리머가 "오늘 여기까지" 하는 시각
const END_AT   = 230;      // 화면이 꺼지고 추천이 뜨는 시각
const STEP = 0.25;         // 틱 간격(초). 고밀도 조건에서 초당 2회 이상 렌더되도록.
const ctx = {lastUserMessage: null};
let source = null, ident = null, timer = null, tick = 0, entered = false;

function buildSources(){
  // 타임라인 RNG는 seed와 시청자 수에만 의존 — label/ratio를 바꿔도 내용 불변
  const rnd = mulberry32(cond.seed * 7919 + cond.viewers);
  source = ScriptSource(cond, rnd, SPAN);
  ident = IdentityAssigner(cond, source.info.chatters, source.counts);
}

let shownTotal = 0, shownAI = 0;            // 참가자가 실제로 본 메시지 기준 집계
let shownCong = 0, shownIncong = 0;         // study 2: 노출된 일치/불일치 발화
let vote = null, chatOpen = true;           // study 2: 참가자 투표와 채팅 잠금 상태
let voteAt = null, unlockAt = null;         // 투표 시각과 확정된 해제 시각
let chatT = 0;                              // 채팅 전용 시계 — 잠금 중에는 멈춤

function loop(){
  tick += STEP;
  const s = Math.floor(tick);
  document.getElementById('clock').textContent =
    Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  // 예고 → 반응 구간 → 투표 → 카운트다운 → 고정 시각에 채팅 해제
  if (!announced && tick >= ANNOUNCE_AT) announcePoll();
  while (reactQueue.length && reactQueue[0].t <= tick){
    const m = reactQueue.shift();
    Renderer.push({kind: m.kind, name: m.name, text: m.text});
    Logger.add('comment_shown', {
      name: m.name, kind: m.kind, text: m.text, stance: null, phase: 'pre_poll'
    });
  }
  if (!vote && tick >= POLL_AT && $('poll').hidden){ showPoll(); lockChat(); }
  if (!outroed && tick >= OUTRO_AT) startOutro();
  while (outroQueue.length && outroQueue[0].t <= tick){
    const m = outroQueue.shift();
    Renderer.push({kind: m.kind, name: m.name, text: m.text});
    Logger.add('comment_shown', {
      name: m.name, kind: m.kind, text: m.text, stance: null, phase: 'outro'
    });
  }
  if (!ended && tick >= END_AT){ endStream(); return; }
  if (!$('poll').hidden && !vote) tickTimer();
  if (vote && !chatOpen && unlockAt !== null){   // 무제한 모드는 이유 제출 전까지 null
    const left = Math.max(0, Math.ceil(unlockAt - tick));
    $('lockMsg').textContent = left > 0
      ? `채팅이 열리기까지 ${left}초` : '채팅이 열립니다';
  }
  if (!chatOpen && unlockAt !== null && tick >= unlockAt) unlockChat();
  if (!chatOpen) return;                    // 잠긴 동안 채팅 시계를 세우지 않음
  // 채팅 시계는 잠금이 풀린 뒤부터 흐릅니다. 영상 시각(tick)을 그대로 쓰면
  // 잠금 구간에 쌓인 메시지가 해제 순간 한꺼번에 쏟아집니다 — 5,000명 조건이면
  // 수백 건이 동시에 터집니다.
  chatT += STEP;

  for (const raw of source.next(chatT)){
    const r = vote ? resolveStance(raw, vote) : {text: raw.text, stance: null};
    const c = ident.assign(raw);
    // 이유 노출을 끄면 입장 배지만 남고 문장은 짧은 동의 표현으로 대체됩니다
    c.text = (r.stance && cond.why === 'off') ? SHORT_STANCE[r.ri % SHORT_STANCE.length] : r.text;
    c.stance = r.stance;

    shownTotal++;
    if (c.kind === 'ai') shownAI++;
    if (r.stance) (r.stance === vote ? shownCong++ : shownIncong++);

    Renderer.push(c);
    Logger.add('comment_shown',
      {kind: c.kind, name: c.name, text: c.text, ...(r.stance ? {stance: r.stance} : {})});
  }
}

/* ── 8. 화면 전환 ────────────────────────── */
const $ = id => document.getElementById(id);
const watch = $('watch'), done = $('done');

/* 숫자에 천 단위 구분 */
const fmt = n => n.toLocaleString('ko-KR');

/* 정체성 표기. 비율을 빼고 "AI 시청자"라고만 쓰면 일부 조건에서도 전원 AI로 읽힙니다. */
function identText(isAI, ratio){
  if (!isAI) return '실제 이용자';
  return ratio >= 100 ? '모두 AI' : `AI ${ratio}% · 실제 이용자 ${100 - ratio}%`;
}

function enter(){
  if (entered) return;
  entered = true;
  Logger.add('watch_start');
  watch.classList.add('on');
  const isAI = cond.label === 'mixed';
  $('watchCnt').textContent = `시청자 ${fmt(cond.viewers)}명`;
  /* 시청 화면에서는 AI 비율을 띄우지 않습니다. 정체성은 채팅 각 줄의
     AI 아이콘·닉네임이 그대로 들고 있고, 비율 수치는 탐색 화면과 안내 페이지의
     조작입니다. 시청 중에 숫자를 계속 띄우면 참가자가 비율 자체를 과제로 삼습니다. */
  $('watchAi').textContent = '';
  $('watchAi').className = 'cnt';
  $('chatAi').textContent = '';
  $('liveStat').innerHTML = `
    <span class="unit"><span class="lbl">시청자</span>
      <span class="num">${fmt(cond.viewers)}<small>명</small></span></span>`;
  const off = cond.input === 'off';
  $('inputRow').hidden = off;
  $('inputOff').hidden = !off;
  buildSources();
  Logger.add('density', {
    viewers: cond.viewers,
    msg_per_sec: +source.info.rate.toFixed(3),
    chatters: source.info.chatters,
    planned_messages: source.total
  });
  // 설정값(ratio)과 실제 배정 결과를 함께 남깁니다 — 조건 간 비교 시 실제값을 씁니다.
  Logger.add('ai_allocation', ident.actual);
  Logger.add('stance_slots', {congruence: cond.cong, ...source.slots});
  Renderer.clear();
  tick = 0; chatT = 0;
  /* 참가자는 방송 도중에 들어온 것으로 둡니다. 들어온 순간 채팅창에는
     이미 지나간 대화가 쌓여 있고, 바닥으로 스크롤된 상태입니다.
     빈 채팅창으로 시작하면 "내가 1번 시청자"처럼 읽혀 규모 조작과 어긋납니다. */
  seedBacklog();
  openChat();
  timer = setInterval(loop, STEP * 1000);
}

/* 투표 예고. 공지 한 줄을 띄우고, 투표가 뜰 때까지 그 신호에 반응하는 발화를 깝니다. */
let announced = false;
let reactQueue = [];
function announcePoll(){
  announced = true;
  // 영상에서 스트리머가 말하는 시점. 채팅에는 아무것도 띄우지 않습니다.
  Logger.add('poll_announced', {at_sec: +tick.toFixed(2)});

  const span = POLL_AT - ANNOUNCE_AT;
  // 규모가 클수록 반응도 많이 올라옵니다
  const n = Math.max(4, Math.min(14, Math.round(source.info.rate * span * 0.8)));
  const rnd = mulberry32(cond.seed * 31337 + cond.viewers);
  const take = (pool, cnt) => {
    const a = pool.slice(), out = [];
    for (let i = 0; i < cnt && a.length; i++) out.push(a.splice(Math.floor(rnd() * a.length), 1)[0]);
    return out;
  };

  const nSig  = n >= 8 ? 3 : 2;
  const nLock = n >= 10 ? 2 : 1;
  const nNoise = Math.max(1, n - nSig - nLock);

  /* 신호는 앞쪽에 — 스트리머 말이 끝나자마자 나오는 게 자연스럽고,
     참가자도 일찍 알아야 합니다. 잠김 아쉬움은 뒤쪽에 — 닫힌다는 걸
     깨닫고 나오는 반응입니다. 소음은 전 구간에 흩뿌립니다. */
  const at = (lo, hi) => ANNOUNCE_AT + 0.5 + (lo + rnd() * (hi - lo)) * (span - 1.2);
  reactQueue = [
    ...take(REACT_SIGNAL, nSig ).map(t => ({text: t, t: at(0,    0.40)})),
    ...take(REACT_NOISE,  nNoise).map(t => ({text: t, t: at(0.05, 1)   })),
    ...take(REACT_LOCK,   nLock).map(t => ({text: t, t: at(0.50, 1)   }))
  ].map(m => {
    const who = ident.roster[Math.floor(rnd() * ident.roster.length)];
    return {...m, kind: who.kind, name: who.name};
  }).sort((a, b) => a.t - b.t);
}

/* 종료 후 추천 영상. 클릭해도 이동하지 않고 클릭 사실만 남깁니다 —
   자극물 밖으로 나가면 이후 행동을 못 봅니다. */
const END_VIDEOS = [
  {t: '새벽에 하는 고민 상담', v: '12만 회'},
  {t: '밸런스게임 모음 2시간', v: '31만 회'},
  {t: '구독자 사연 읽기', v: '8.7만 회'}
];
function renderEndCard(){
  const g = $('ecGrid'); g.innerHTML = '';
  END_VIDEOS.forEach((v, i) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'ec-item';
    el.innerHTML = `<span class="ec-thumb"></span>
      <span class="ec-t">${v.t}</span><span class="ec-v">조회수 ${v.v}</span>`;
    el.addEventListener('click', () => {
      el.style.outline = '2px solid var(--accent)';
      Logger.add('next_video_click', {index: i, title: v.t, at_sec: +tick.toFixed(2)});
    });
    g.appendChild(el);
  });
}

/* 방송 마무리. 스트리머가 접으려 하고 채팅이 인사를 합니다. */
let outroed = false, ended = false;
let outroQueue = [];
function startOutro(){
  outroed = true;
  Logger.add('outro_started', {at_sec: +tick.toFixed(2)});
  const span = END_AT - OUTRO_AT;
  const n = Math.max(5, Math.min(16, Math.round(source.info.rate * span * 0.7)));
  const rnd = mulberry32(cond.seed * 7753 + cond.viewers);
  const pool = REACT_OUTRO.slice();
  outroQueue = [];
  for (let i = 0; i < n; i++){
    const who = ident.roster[Math.floor(rnd() * ident.roster.length)];
    outroQueue.push({
      t: OUTRO_AT + 0.8 + rnd() * (span - 1.5),
      kind: who.kind, name: who.name,
      text: pool.length ? pool.splice(Math.floor(rnd() * pool.length), 1)[0]
                        : REACT_OUTRO[i % REACT_OUTRO.length]
    });
  }
  outroQueue.sort((a, b) => a.t - b.t);
}

/* 방송 종료. 화면이 꺼지고 그 자리에 추천이 뜹니다.
   참가자는 여기서 구독하거나 다음 영상을 누르거나, 그냥 나갈 수 있습니다. */
function endStream(){
  ended = true;
  clearInterval(timer);
  Logger.add('stream_ended', {at_sec: +tick.toFixed(2)});
  $('player').classList.add('off');
  renderEndCard();
  $('poll').hidden = true;                  // 투표 카드가 종료 화면 뒤에 비쳐 보이지 않게
  $('endCard').hidden = false;
  $('endSub').textContent = subscribed ? '구독중' : '구독하기';
  $('endSub').setAttribute('aria-pressed', String(subscribed));
  /* 채팅은 그대로 둡니다 — 실제 플랫폼도 방송이 끝나면 채팅창이 남습니다.
     입력만 막고, 지나간 대화는 계속 읽고 드래그할 수 있습니다. */
  $('inputRow').hidden = true;
  $('inputOff').hidden = false;
  $('inputOff').textContent = '방송이 종료되어 채팅을 보낼 수 없습니다.';
}

/* 입장 직전까지 흘렀던 대화. 타임라인과 같은 화자·같은 정체성 배분을 쓰되
   시각만 과거로 돌려 즉시 그려 넣습니다. 입장 전 발화이므로 입장(stance)은 없고
   로그에도 before_join으로 따로 표시해 분석에서 제외할 수 있게 둡니다. */
function seedBacklog(){
  for (const raw of source.pre){
    const c = ident.assign(raw);          // 화자 배분도 타임라인과 같은 규칙을 따릅니다
    Renderer.push({kind: c.kind, name: c.name, text: c.text});
    Logger.add('comment_shown', {
      name: c.name, kind: c.kind, text: c.text, stance: null, before_join: true
    });
  }
  feed.scrollTop = feed.scrollHeight;
}

/* ── 8-0. 안내 페이지 ────────────────────
   "시작 전에 안내/지시문 페이지 — 시청자수 잘 보이게" 반영.
   조작 정보를 자극물 전에 한 번 더 노출해 라벨 미인지를 줄입니다.
   참가자에게 사람이라고 고지할지(deception)는 미정이라 중립 문구로 둡니다. */
function showIntro(){

  $('intro').classList.add('on');
  watch.classList.remove('on');
  /* 안내 페이지는 플랫폼 화면이 아니라 지시문입니다. 헤더가 같이 보이면
     안내문이 사이트의 일부처럼 읽혀서 감춥니다. */
  $('siteBar').style.display = 'none';

  $('introTitle').textContent = '잠시 후 방송을 보게 됩니다';
  $('introLead').textContent =

    '생각하신 대로 고르시고, 왜 그렇게 생각했는지도 한 줄 적어주세요. ' +
    '그 동안만 채팅이 잠깁니다. 평소에 방송 보듯이 보시면 됩니다.';

  $('introCard').innerHTML = `
    <div class="intro-row"><span class="k">방송</span>
      <span class="v">${STREAM_TITLE}</span></div>
    <div class="intro-row"><span class="k">시청자 수</span>
      <span class="v">${fmt(cond.viewers)}명</span></div>
    <div class="intro-row"><span class="k">시청자 구성</span>
      <span class="v ${isAI ? 'ai' : ''}">${identText(isAI, cond.ratio)}</span></div>`;

  /* 비율이 100%가 아닌 조건에서 "시청자는 AI입니다"라고 쓰면 사실과 다릅니다. */

    : cond.ratio >= 100
      ? '이 방송의 채팅에 참여하는 시청자는 모두 AI입니다.'
      : `이 방송의 채팅에 참여하는 시청자 중 ${cond.ratio}%가 AI입니다.`;

  Logger.add('intro_shown', {viewers: cond.viewers, identity: isAI ? 'ai' : 'human'});
}

/* 고유 코드 또는 이메일 둘 다 받습니다. @가 들어 있으면 이메일로 보고 형식을 보고,
   아니면 코드로 봅니다. 형식을 깐깐하게 잡으면 멀쩡한 값이 막힙니다. */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function introGo(){
  const el = $('pidEmail');
  const v = el.value.trim().toLowerCase();
  const bad = v.includes('@') ? !EMAIL_RE.test(v) : v.length < 2;
  if (bad){
    el.classList.add('bad');
    $('idNote').textContent = v.includes('@')
      ? '이메일 주소를 다시 확인해주세요.' : '코드 또는 이메일 주소를 입력해주세요.';
    $('idNote').classList.add('bad');
    el.focus();
    return;
  }
  el.classList.remove('bad');
  $('idNote').classList.remove('bad');
  cond.pid = v;
  Sink.setPid(v);
  Logger.add('participant_id', {value: v, kind: v.includes('@') ? 'email' : 'code'});
  Logger.add('intro_done', {at: +((Date.now() - Logger.t0) / 1000).toFixed(2)});
  $('intro').classList.remove('on');
  $('siteBar').style.display = '';
  enter();
}

/* ── 반응 버튼 ────────────────────────────
   누르라고 유도하지 않고 자리만 둡니다. 클릭 여부·시각·취소까지 남깁니다. */
let react = null;
function setReact(v){
  react = (react === v) ? null : v;
  $('reactUp').setAttribute('aria-pressed', String(react === 'up'));
  $('reactDown').setAttribute('aria-pressed', String(react === 'down'));
  Logger.add('reaction', {value: react, at_sec: +tick.toFixed(2)});
}

/* ── 8-1. Study 2: 투표와 채팅 잠금 ──────── */
/* 투표·채팅 해제 타이밍. 채팅 노출 시간이 참가자마다 달라지면 안 되므로
   해제는 투표 시점이 아니라 **고정 시각**에 일어납니다. 빨리 투표한 사람이
   채팅을 더 오래 보는 일이 없습니다. */
const POLL_AT     = 30;   // 투표 카드가 뜨고 채팅이 잠기는 시각(초)
const ANNOUNCE_AT = 22;   // 스트리머가 "투표 올린다, 채팅 잠근다"고 예고하는 시각
/* 예고 없이 갑자기 잠그면 참가자가 고장으로 읽습니다. 예고와 투표 사이
   8초 동안 채팅이 그 신호에 반응하는 구간을 둡니다. */
const UNLOCK_GAP = 3;    // 투표 마감 후 채팅이 열리기까지(초)
const LATE_GAP   = 3;    // 마감을 넘겨 투표한 경우에만 쓰는 지연

/* 투표 제한 시간은 조건값(cond.pollwin)입니다.
   0이면 제한을 두지 않습니다 — 카운트다운을 숨기고 투표한 시점을 기준으로 채팅을 엽니다.
   이 경우 투표가 빠른 참가자와 느린 참가자의 채팅 노출 시작점이 달라지므로,
   노출량을 맞추려면 0이 아닌 값을 써야 합니다. */
const noLimit      = () => cond.pollwin === 0;
const pollDeadline = () => POLL_AT + cond.pollwin;
const unlockTime   = () => pollDeadline() + UNLOCK_GAP;   // 제한이 있을 때 전 참가자 공통

function lockChat(){
  chatOpen = false;
  $('feed').hidden = true;
  $('chatLocked').hidden = false;
  $('inputRow').hidden = true;
  $('inputOff').hidden = true;
}

/* 입장 시점의 열린 상태. unlockChat()은 투표 뒤의 해제이고 로그가 다릅니다. */
function openChat(){
  chatOpen = true;
  $('feed').hidden = false;
  $('chatLocked').hidden = true;
  const off = cond.input === 'off';
  $('inputRow').hidden = off;
  $('inputOff').hidden = !off;
}

function unlockChat(){
  if (chatOpen) return;
  // 이유를 쓰다 만 상태로 해제 시각이 오면 적힌 만큼 자동 제출합니다 —
  // 제출을 기다리면 해제 시각이 사람마다 달라집니다.
  if (cond.why === 'on' && !$('pollWhy').hidden) submitWhy(true);
  if (vote && !voteLocked) lockVote();
  chatOpen = true;
  $('feed').hidden = false;
  $('chatLocked').hidden = true;
  const off = cond.input === 'off';
  $('inputRow').hidden = off;
  $('inputOff').hidden = !off;
  Logger.add('chat_unlocked', {at_sec: +tick.toFixed(2), scheduled_at: unlockAt});
}

/* 투표 카운트다운 — 실제 플랫폼 투표처럼 남은 시간을 보여줍니다. */
function tickTimer(){
  const el = $('pollTimer');
  if (noLimit()){ el.textContent = ''; return; }
  const left = Math.max(0, pollDeadline() - tick);
  el.textContent = left > 0 ? `${Math.ceil(left)}초 남음` : '마감';
  /* 남은 시간을 붉게 띄우는 연출은 뺐습니다. 투표까지의 시간을 DV로 쓰는데
     마감 압박이 들어가면 그 분포가 조건이 아니라 연출 때문에 눌립니다. */
}

function showPoll(){
  const p = $('poll');
  p.hidden = false;
  $('pollQ').textContent = DILEMMA.q;
  $('pollBody').textContent = DILEMMA.body;
  const box = $('pollOpts');
  box.innerHTML = '';
  ['A','B'].forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.v = k;
    b.setAttribute('aria-pressed', 'false');
    b.textContent = DILEMMA[k].label;
    /* 선택지 위에 커서를 올린 시간. 두 선택지를 오가며 재는 행동이 그대로 남습니다.
       주의: 체류 시간을 '숙고'로 읽지 않습니다 — 갈등 지표로만 씁니다. */
    let inAt = 0;
    b.addEventListener('mouseenter', () => { inAt = performance.now(); });
    b.addEventListener('mouseleave', () => {
      if (!inAt) return;
      const dur = Math.round(performance.now() - inAt);
      inAt = 0;
      if (dur < 60) return;                 // 지나가는 커서는 버립니다
      optHover[k] = (optHover[k] || 0) + dur;
      optHoverN[k] = (optHoverN[k] || 0) + 1;
      Logger.add('option_hover', {
        choice: k, dur_ms: dur, at_sec: +tick.toFixed(2),
        voted: vote, locked: voteLocked
      });
    });
    b.addEventListener('click', () => castVote(k));
    box.appendChild(b);
  });
  $('lockMsg').textContent = '투표하면 채팅이 다시 열립니다';
  Logger.add('poll_shown', {at_sec: +tick.toFixed(2), window_sec: cond.pollwin});
}

/* 투표는 '보내기' 전까지 바꿀 수 있습니다. 바꾼 이력이 그대로 남습니다 —
   한 번에 고른 사람과 왔다갔다한 사람은 다른 참가자입니다.
   확정은 이유를 제출하는 순간입니다. */
let voteLocked = false;
let voteClicks = 0, firstVote = null, firstVoteAt = null;
const optHover = {}, optHoverN = {};

function castVote(k){
  if (voteLocked) return;
  const prev = vote;
  if (prev === k) return;                  // 같은 걸 다시 눌렀으면 변화 없음

  vote = k;
  voteAt = tick;                           // 마지막으로 고른 시각
  voteClicks++;
  if (firstVote === null){ firstVote = k; firstVoteAt = tick; }

  document.querySelectorAll('#pollOpts button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.v === k)));

  $('pollTimer').textContent = '선택함';
  const d = $('pollDone');
  d.hidden = false;
  d.textContent = `${DILEMMA[k].label} 쪽을 골랐습니다. 아래에 이유를 적고 보내기를 누르면 확정됩니다.`;

  Logger.add('vote_click', {
    choice: k, label: DILEMMA[k].label, from: prev,
    changed: prev !== null, seq: voteClicks, at_sec: +tick.toFixed(2)
  });

  if (cond.why === 'on'){
    $('pollWhy').hidden = false;
    $('lockMsg').textContent = '의견을 보내면 채팅이 다시 열립니다';
    $('whyText').focus();
  } else {
    lockVote();
  }
}

/* 확정. 이유를 보낸 시점(또는 이유를 안 받는 조건에서는 투표 시점)에 걸립니다. */
function lockVote(){
  if (voteLocked) return;
  voteLocked = true;
  document.querySelectorAll('#pollOpts button').forEach(b => { b.disabled = true; });

  const late = !noLimit() && tick > pollDeadline();
  /* 제한이 있으면 전원 같은 시각에 엽니다. 무제한이면 확정 시점 기준입니다. */
  unlockAt = noLimit() ? tick + UNLOCK_GAP
           : late      ? tick + LATE_GAP
                       : unlockTime();

  $('pollTimer').textContent = '투표함';
  Logger.add('vote', {
    choice: vote, label: DILEMMA[vote].label,
    at_sec: +tick.toFixed(2),
    first_choice: firstVote,
    first_at_sec: firstVoteAt === null ? null : +firstVoteAt.toFixed(2),
    changed: firstVote !== vote,
    n_clicks: voteClicks,
    // 처음 고른 뒤 확정까지 걸린 시간 — 망설임의 길이
    settle_sec: firstVoteAt === null ? null : +(tick - firstVoteAt).toFixed(2),
    late, unlock_at: unlockAt
  });
}

/* auto=true는 해제 시각이 되어 자동 제출된 경우입니다. */
function submitWhy(auto){
  const el = $('whyText');
  const v = el.value.trim();
  /* 이유는 사실상 필수입니다. 직접 '보내기'를 누를 때는 비어 있으면 받지 않고,
     해제 시각이 지나 자동 제출될 때만 빈 값을 허용합니다 — 투표 자체를
     못 끝내게 막으면 참가자가 이탈합니다. */
  if (!auto && !v){
    $('whyNote').textContent = '한 줄만 적어주세요.';
    el.focus();
    return false;
  }
  $('pollWhy').hidden = true;
  if (v){
    Logger.add('vote_reason', {text: v, length: v.length, auto: !!auto,
                               at_sec: +tick.toFixed(2)});
    Renderer.push({kind:'me', name:'나', text: v, stance: vote});
  } else {
    Logger.add('vote_reason', {text: null, length: 0, auto: !!auto});
  }
  return true;
}

function sendWhy(){
  if (!vote){
    $('whyNote').textContent = '먼저 위에서 하나를 골라주세요.';
    $('whyNote').classList.add('bad');
    return;
  }
  if (!submitWhy(false)) return;
  lockVote();
  $('pollDone').textContent = '투표와 의견이 기록됐습니다. 잠시 뒤 채팅이 열립니다.';
  $('lockMsg').textContent = '잠시 뒤 채팅이 열립니다';
}

/* 구독. 토글이며 취소도 그대로 남깁니다 — 누른 뒤 무른 것과 안 누른 것은 다른 행동입니다. */
let subscribed = false;
function toggleSub(where){
  subscribed = !subscribed;
  $('subBtn').setAttribute('aria-pressed', String(subscribed));
  $('subBtn').textContent = subscribed ? '구독중' : '구독';
  $('endSub').setAttribute('aria-pressed', String(subscribed));
  $('endSub').textContent = subscribed ? '구독중' : '구독하기';
  // 어디서 눌렀는지가 중요합니다 — 보는 중에 누른 것과 떠날 때 누른 것은 다른 행동입니다
  Logger.add('subscribe', {on: subscribed, where, at_sec: +tick.toFixed(2)});
}

function leave(){
  clearInterval(timer);
  Logger.add('leave', {
    dwell_sec: +tick.toFixed(2),
    comments_typed: Logger.ev.filter(e => e.type === 'user_comment').length,
    // 체류 중 실제로 노출된 메시지 기준 AI 비율 — 분석에 쓸 값
    shown_messages: shownTotal,
    shown_ai: shownAI,
    shown_ai_ratio: shownTotal ? +(shownAI / shownTotal * 100).toFixed(1) : null,
    reaction: react,
    subscribed,
    // 끝까지 봤는지 — 마무리를 들었는지, 종료 화면까지 갔는지
    saw_outro: outroed,
    saw_end: ended,
    // 채팅 스크롤백 — 위로 올린 횟수, 최대 깊이, 바닥에서 떨어져 있던 시간
    scroll: {...scrollStats, away_ms: Math.round(scrollStats.away_ms)},
    // 어떤 사용자 카드를 몇 번 열어봤는지 — 호버/클릭을 구분해 남깁니다
    user_cards: Object.fromEntries(
      Object.entries(userStats).filter(([, v]) => v.opens > 0)
        .map(([k, v]) => [k, v.opens])),
    vote,
    vote_first_choice: firstVote,
    vote_changed: firstVote !== null && firstVote !== vote,
    vote_clicks: voteClicks,
    // 선택지별 커서 체류 — 어느 쪽을 더 들여다봤는지
    option_hover_ms: {...optHover},
    option_hover_n: {...optHoverN},
    vote_at_sec: voteAt === null ? null : +voteAt.toFixed(2),
    unlock_at_sec: unlockAt,
    // 채팅에 실제로 노출된 시간 — 해제가 고정 시각이므로 끝까지 본 사람은 전원 동일
    chat_exposure_sec: (unlockAt !== null && tick > unlockAt)
      ? +(tick - unlockAt).toFixed(2) : 0,
    congruence: cond.cong,
    shown_congruent: shownCong,
    shown_incongruent: shownIncong,
    // 체류 중 실제로 본 입장 발화 중 참가자와 일치한 비율 — 분석에 쓸 값
    shown_congruence_ratio: (shownCong + shownIncong)
      ? +(shownCong / (shownCong + shownIncong) * 100).toFixed(1) : null,
    /* 위는 '피드에 붙은' 기준, 아래는 '화면에 떠 있던' 기준.
       둘의 차이 자체가 보고할 값입니다 — 크면 측정 방식이 결과를 바꾼다는 뜻입니다. */
    ...seenSummary()
  });
  watch.classList.remove('on');
  done.classList.add('on');
  $('logbox').value = Logger.dump();
  /* 세션 종료 시점에 남은 이벤트를 전부 밀어 넣습니다. */
  Sink.flush(true);
  $('sinkNote').textContent = Sink.enabled()
    ? `서버로 전송했습니다. session_id: ${Sink.id()}`
    : '서버 설정이 비어 있어 로컬에만 쌓였습니다. 아래에서 JSON으로 내려받으세요.';
}

function send(){
  const el = $('say');
  const v = el.value.trim();
  if (!v) return;
  Renderer.push({kind: 'me', name: '나', text: v});
  Logger.add('user_comment', {text: v});
  ctx.lastUserMessage = v;
  el.value = '';
}

function restart(){
  clearInterval(timer);
  entered = false; tick = 0; chatT = 0;
  shownTotal = 0; shownAI = 0; shownCong = 0; shownIncong = 0;
  vote = null; chatOpen = true; voteAt = null; unlockAt = null;
  react = null;
  ctx.lastUserMessage = null;
  Renderer.clear();
  $('poll').hidden = true;
  $('pollWhy').hidden = true;
  $('pollDone').hidden = true;
  $('whyText').value = '';
  $('whyNote').textContent = '';
  $('pollTimer').textContent = '';
  $('lockMsg').textContent = '투표가 끝나면 채팅이 열립니다';
  $('feed').hidden = false;
  $('chatLocked').hidden = true;
  $('intro').classList.remove('on');
  $('siteBar').style.display = '';
  $('reactUp').setAttribute('aria-pressed', 'false');
  $('reactDown').setAttribute('aria-pressed', 'false');
  subscribed = false;
  announced = false; reactQueue = [];
  outroed = false; ended = false; outroQueue = [];
  $('player').classList.remove('off');
  $('endCard').hidden = true;
  $('inputOff').textContent = '이 방송은 채팅 입력이 제한되어 있습니다.';
  voteLocked = false; voteClicks = 0; firstVote = null; firstVoteAt = null;
  for (const k of Object.keys(optHover)) delete optHover[k];
  for (const k of Object.keys(optHoverN)) delete optHoverN[k];
  Object.assign(scrollStats, {up_events:0, max_depth_px:0, away_ms:0, reached_top:false});
  $('subBtn').setAttribute('aria-pressed', 'false');
  $('subBtn').textContent = '구독';
  done.classList.remove('on');
  watch.classList.remove('on');
  Logger.start();

  $('streamTitle').textContent = STREAM_TITLE;

  if (cond.intro === 'on'){
    showIntro();                       // 안내 → 시작하기 → 방송
  } else {
    enter();                           // 링크를 타고 바로 입장
  }
}
/* ── 시작 ───────────────────────────────── */
/* 첫 진입도 restart()를 거칩니다. 예전에는 renderBrowse()를 직접 불러서
   intro=on이어도 첫 화면에 안내 페이지가 안 떴습니다 — 조건을 바꾸거나
   '다시 시작'을 눌러야 나왔습니다. 참가자에게는 첫 진입이 전부이므로
   부트 경로와 재시작 경로를 하나로 둡니다. */
/* ── 배선 ───────────────────────────────── */
$('introGo').addEventListener('click', introGo);
$('whyText').addEventListener('input', () => {
  $('whyText').classList.remove('bad');
  $('whyNote').classList.remove('bad');
  $('whyNote').textContent = '';
});
$('pidEmail').addEventListener('keydown', e => { if (e.key === 'Enter') introGo(); });
$('pidEmail').addEventListener('input', () => {
  $('pidEmail').classList.remove('bad');
  $('idNote').classList.remove('bad');
  $('idNote').textContent = '설문 응답과 연결하는 데만 씁니다.';
});
$('whySend').addEventListener('click', sendWhy);
$('subBtn').addEventListener('click', () => toggleSub('header'));
$('endSub').addEventListener('click', () => toggleSub('endcard'));
$('reactUp').addEventListener('click', () => setReact('up'));
$('reactDown').addEventListener('click', () => setReact('down'));
$('leave').addEventListener('click', leave);
$('sendBtn').addEventListener('click', send);
$('say').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('again').addEventListener('click', restart);
$('dlLog').addEventListener('click', () => {
  const blob = new Blob([Logger.dump()], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${cond.pid}_${ConditionRouter.id(cond)}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('copyLog').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('logbox').value); $('copyLog').textContent = '복사됨'; }
  catch { $('logbox').select(); }
  setTimeout(() => { $('copyLog').textContent = '로그 복사'; }, 1500);
});

initChatScroll();
initSeen();
initTextSelect();
restart();
</script>
</body>
</html>
